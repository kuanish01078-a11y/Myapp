<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Corners & Bookie Decoder TG (KZT)</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-yellow: #facc15;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
            font-size: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        h2 { margin: 0 0 12px 0; font-size: 1.05rem; color: #fff; font-weight: 600; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        input, select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #ffffff !important;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
        }

        .segmented-control {
            display: flex;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 3px;
            margin-bottom: 12px;
        }

        .segment-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 0;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
        }

        .segment-btn.active {
            background-color: var(--accent-blue);
            color: #0f172a;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .result-card {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .result-card .title { font-size: 0.75rem; color: var(--text-muted); }
        .result-card .value { font-size: 1.15rem; font-weight: 700; margin-top: 4px; color: #ffffff !important; }

        .ev-positive { color: var(--accent-green) !important; }
        .ev-negative { color: var(--accent-red) !important; }

        .table-wrapper { overflow-x: auto; margin-top: 12px; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 6px;
            text-align: center;
            color: #ffffff;
        }

        th { background-color: var(--input-bg); color: var(--text-muted); }

        .speech-box {
            background-color: rgba(250, 204, 21, 0.1);
            border-left: 3px solid var(--accent-yellow);
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #fef08a;
        }

        .speech-title {
            font-weight: bold;
            color: var(--accent-yellow);
            margin-bottom: 4px;
            font-size: 0.8rem;
        }

        /* Постоянная фиксированная кнопка внизу */
        .btn-send {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background-color: var(--accent-blue);
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            z-index: 999;
        }

        .btn-calc {
            background-color: var(--accent-blue);
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Параметры -->
    <div class="card">
        <h2>📊 Параметры угловых (Матч)</h2>
        <div class="grid-2">
            <div class="form-group">
                <label for="homeAvg">Угл. Хозяев</label>
                <input type="number" id="homeAvg" step="0.1" value="5.8" inputmode="decimal">
            </div>
            <div class="form-group">
                <label for="awayAvg">Угл. Гостей</label>
                <input type="number" id="awayAvg" step="0.1" value="4.4" inputmode="decimal">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="bankroll">Банк (₸)</label>
                <input type="number" id="bankroll" value="100000" step="1000" inputmode="numeric">
            </div>
            <div class="form-group">
                <label for="kellyFraction">Келли (Риск)</label>
                <select id="kellyFraction">
                    <option value="0.25">1/4 Kelly (Безопасный)</option>
                    <option value="0.5">1/2 Kelly (Умеренный)</option>
                    <option value="1.0">Full Kelly (Агрессивный)</option>
                </select>
            </div>
        </div>
        <button class="btn-calc" onclick="calculateAll()">Пересчитать модель</button>
    </div>

    <!-- Тайм -->
    <div class="card">
        <div class="segmented-control">
            <button class="segment-btn active" id="btnHalf1" onclick="setHalf(1)">1-й Тайм (44%)</button>
            <button class="segment-btn" id="btnHalf2" onclick="setHalf(2)">2-й Тайм (56%)</button>
        </div>
        <div id="halfResults"></div>
    </div>

    <!-- Декодер коэффициентов -->
    <div class="card">
        <h2>🗣 Декодер «Языка Букмекеры»</h2>
        <div class="grid-2">
            <div class="form-group">
                <label for="kOver">Кэф на ТБ (<span id="targetTotalLabel">3.5</span>)</label>
                <input type="number" id="kOver" step="0.01" value="1.95" inputmode="decimal" oninput="decodeBookie()">
            </div>
            <div class="form-group">
                <label for="kUnder">Кэф на ТМ (<span id="targetTotalLabelUnder">3.5</span>)</label>
                <input type="number" id="kUnder" step="0.01" value="1.85" inputmode="decimal" oninput="decodeBookie()">
            </div>
        </div>

        <div id="decoderOutput"></div>
    </div>

    <!-- Фиксированная кнопка -->
    <button class="btn-send" onclick="sendDataToChat()">📩 Отправить расчет в чат</button>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    let activeHalf = 1;
    let mathData = {};
    const phi = 1.18;
    let currentAnalysis = {};

    function formatKZT(amount) {
        return new Intl.NumberFormat('ru-RU').format(Math.round(amount)) + ' ₸';
    }

    function customPoisson(k, lambda, phi) {
        let adjLambda = lambda / phi;
        let factorial = 1;
        for (let i = 1; i <= k; i++) factorial *= i;
        return (Math.pow(adjLambda, k) * Math.exp(-adjLambda)) / factorial;
    }

    function setHalf(half) {
        activeHalf = half;
        document.getElementById('btnHalf1').classList.toggle('active', half === 1);
        document.getElementById('btnHalf2').classList.toggle('active', half === 2);
        
        const target = half === 1 ? '3.5' : '4.5';
        document.getElementById('targetTotalLabel').innerText = target;
        document.getElementById('targetTotalLabelUnder').innerText = target;

        renderHalfUI();
        decodeBookie();
    }

    function calculateAll() {
        const homeAvg = parseFloat(document.getElementById('homeAvg').value) || 0;
        const awayAvg = parseFloat(document.getElementById('awayAvg').value) || 0;

        mathData[1] = processHalf(homeAvg * 0.44, awayAvg * 0.44, [3.5, 4.5, 5.5]);
        mathData[2] = processHalf(homeAvg * 0.56, awayAvg * 0.56, [4.5, 5.5, 6.5]);

        renderHalfUI();
        decodeBookie();
    }

    function processHalf(lHome, lAway, totals) {
        let maxC = 12;
        let probArray = new Array(maxC + 1).fill(0);

        for (let i = 0; i <= 8; i++) {
            let pH = customPoisson(i, lHome, phi);
            for (let j = 0; j <= 8; j++) {
                let pA = customPoisson(j, lAway, phi);
                if (i + j <= maxC) probArray[i + j] += pH * pA;
            }
        }

        let sumP = probArray.reduce((a, b) => a + b, 0);
        probArray = probArray.map(p => p / sumP);

        let resTotals = {};
        totals.forEach(t => {
            let overP = probArray.slice(Math.floor(t) + 1).reduce((a, b) => a + b, 0);
            resTotals[t] = { over: overP, under: 1 - overP };
        });

        return {
            expected: lHome + lAway,
            probArray: probArray,
            totals: resTotals
        };
    }

    function renderHalfUI() {
        const data = mathData[activeHalf];
        if (!data) return;

        let html = `
            <div class="results-grid">
                <div class="result-card">
                    <div class="title">Ожидаемо угл.</div>
                    <div class="value">${data.expected.toFixed(2)}</div>
                </div>
        `;

        Object.keys(data.totals).forEach(t => {
            let overP = (data.totals[t].over * 100).toFixed(1);
            html += `
                <div class="result-card">
                    <div class="title">Шанс ТБ ${t}</div>
                    <div class="value">${overP}%</div>
                </div>
            `;
        });

        html += `</div>`;

        html += `<div class="table-wrapper"><table><tr><th>Угл</th>`;
        for (let k = 0; k <= 7; k++) html += `<th>${k}</th>`;
        html += `<th>8+</th></tr><tr><td>%</td>`;
        for (let k = 0; k <= 7; k++) html += `<td>${(data.probArray[k] * 100).toFixed(0)}</td>`;
        
        let p8Plus = data.probArray.slice(8).reduce((a, b) => a + b, 0);
        html += `<td>${(p8Plus * 100).toFixed(0)}</td></tr></table></div>`;

        document.getElementById('halfResults').innerHTML = html;
    }

    function decodeBookie() {
        const kOver = parseFloat(document.getElementById('kOver').value);
        const kUnder = parseFloat(document.getElementById('kUnder').value);

        if (!kOver || !kUnder || kOver <= 1 || kUnder <= 1) return;

        const margin = ((1 / kOver) + (1 / kUnder) - 1) * 100;
        const targetTotal = activeHalf === 1 ? 3.5 : 4.5;
        const myProbOver = mathData[activeHalf] ? mathData[activeHalf].totals[targetTotal].over : 0.5;

        const evOver = (myProbOver * kOver) - 1;

        let speech = "";
        if (margin > 7.5) {
            speech = `Заложена высокая маржа (${margin.toFixed(1)}%). Букмекер страхует риски.`;
        } else if (evOver > 0.04) {
            speech = `БК дал переоцененный кэф ${kOver}. Наша модель видит валуй (EV +${(evOver * 100).toFixed(1)}%).`;
        } else {
            speech = `Линия сбалансирована. Оценка букмекера совпадает с математикой.`;
        }

        const bankroll = parseFloat(document.getElementById('bankroll').value) || 100000;
        const fraction = parseFloat(document.getElementById('kellyFraction').value) || 0.25;
        const b = kOver - 1;
        const q = 1 - myProbOver;
        let kelly = ((b * myProbOver - q) / b) * fraction;
        if (kelly < 0) kelly = 0;

        const stakeAmountKZT = bankroll * kelly;

        currentAnalysis = {
            half: activeHalf,
            expected: mathData[activeHalf] ? mathData[activeHalf].expected.toFixed(2) : 0,
            targetTotal: targetTotal,
            probOver: (myProbOver * 100).toFixed(1),
            kOver: kOver,
            kUnder: kUnder,
            margin: margin.toFixed(1),
            ev: (evOver * 100).toFixed(1),
            stakeKZT: formatKZT(stakeAmountKZT),
            kellyPercent: (kelly * 100).toFixed(1),
            speech: speech
        };

        document.getElementById('decoderOutput').innerHTML = `
            <div class="results-grid">
                <div class="result-card">
                    <div class="title">Маржа БК</div>
                    <div class="value">${margin.toFixed(1)}%</div>
                </div>
                <div class="result-card">
                    <div class="title">EV Ставки</div>
                    <div class="value ${evOver > 0 ? 'ev-positive' : 'ev-negative'}">${(evOver * 100).toFixed(1)}%</div>
                </div>
                <div class="result-card" style="grid-column: span 2;">
                    <div class="title">Рекомендованная ставка</div>
                    <div class="value" style="color:var(--accent-blue);">${formatKZT(stakeAmountKZT)} (${(kelly * 100).toFixed(1)}% от банка)</div>
                </div>
            </div>

            <div class="speech-box">
                <div class="speech-title">💡 МЫСЛЬ БУКМЕКЕРА:</div>
                ${speech}
            </div>
        `;
    }

    function sendDataToChat() {
        if (!currentAnalysis.targetTotal) return;

        const report = `📊 ОТЧЕТ ПО УГЛОВЫМ (${currentAnalysis.half}-й Тайм)\n\n` +
            `🎯 Ожидаемо угловых: ${currentAnalysis.expected}\n` +
            `📈 Шанс ТБ ${currentAnalysis.targetTotal}: ${currentAnalysis.probOver}%\n` +
            `🎲 Кэфы БК: ТБ ${currentAnalysis.kOver} | ТМ ${currentAnalysis.kUnder}\n` +
            `📌 Маржа БК: ${currentAnalysis.margin}%\n` +
            `💡 EV (Ценность): ${currentAnalysis.ev}%\n\n` +
            `💰 РЕКОМЕНДАЦИЯ:\n` +
            `Ставка: ${currentAnalysis.stakeKZT} (${currentAnalysis.kellyPercent}% от банка)\n\n` +
            `💬 Мысль БК: ${currentAnalysis.speech}`;

        tg.sendData(report);
    }

    window.onload = function() {
        calculateAll();
    };
</script>

</body>
</html>
